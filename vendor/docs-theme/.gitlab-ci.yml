workflow:
  # MergeRequest-Pipelines.gitlab-ci.yml
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - component: $CI_SERVER_FQDN/code-ops/ci-components/release-changelog@14.1.0
    inputs:
      stage: release
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: manual

default:
  image: ghcr.io/astral-sh/uv:0.11.10-python3.13-trixie-slim@sha256:de2a45b93999c5156f65fa8cd0228e3973eccf81fe42cfa02bd6e70fe7006b9b
  tags:
    - DOCKER

stages:
  - build-dist
  - build-e2e
  - test
  - deploy
  - release

variables:
  DOCKERFILENAME: docs-theme-test
  http_proxy: $CODE_PROXY
  https_proxy: $CODE_PROXY
  no_proxy: $CODE_NO_PROXY
  HTTP_PROXY: $CODE_PROXY
  HTTPS_PROXY: $CODE_PROXY
  NO_PROXY: $CODE_NO_PROXY
  GIT_LFS_SKIP_SMUDGE: "1"
  UV_LOCKED: "true"
  UV_LINK_MODE: copy

.rules-merge-requests:
  rules:
    - if: $CI_MERGE_REQUEST_IID

build-dist:
  stage: build-dist
  image: nikolaik/python-nodejs:python3.12-nodejs24-slim@sha256:503da5f83764ba71385da87b4c852ddeb650e47a2a952e3373d39dd2c634024f
  before_script:
    - npm install -g corepack@0.24.1 # Remove once https://github.com/nodejs/corepack/issues/447 is fixed
    - apt-get update
    - apt-get install -y git jq
  script:
    - uv sync --dev --all-extras
    - yarn --frozen-lockfile
    - yarn dist:setup
    - yarn dist:build
    - yarn lint:playwright-tsc
  artifacts:
    expire_in: 3h
    paths:
      - dist/
      - mkdocs_siemens/

build-e2e:
  stage: build-e2e
  extends: .rules-merge-requests
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.27.0-debug@sha256:c6acf2ef8593502b122344bcf23e60ba0f1a25e8b8fee763dcb524504613c367
    entrypoint: [""]
  variables:
    HTTP_PROXY: $CODE_PROXY
    HTTPS_PROXY: $CODE_PROXY
    NO_PROXY: $CODE_NO_PROXY
  id_tokens:
    CR_PROXY_TOKEN:
      aud: https://code.siemens.com
  script:
    - executor login -u $GITLAB_USER_LOGIN -p $CR_PROXY_TOKEN $CODE_CR_PROXY
    - executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $CI_REGISTRY_IMAGE/$DOCKERFILENAME:dev-$CI_COMMIT_SHORT_SHA
      --build-arg HTTP_PROXY
      --build-arg HTTPS_PROXY
      --build-arg NO_PROXY
      --registry-mirror $CODE_CR_PROXY_HOST
  dependencies:
    - build-dist

.build-mkdocs:
  extends: .rules-merge-requests
  stage: build-e2e
  variables:
    MKDOCS_CONFIG: mkdocs.yml
    DOCS_ENGINE: mkdocs
    # Review builds are served from a sub-path, so keep directory URLs off.
    # Set as a job variable (not inline) so it also works on the PowerShell runner.
    USE_DIRECTORY_URLS: "false"
  dependencies:
    - build-dist
  script:
    - uv run --all-extras ${DOCS_ENGINE} build --strict --config-file "${MKDOCS_CONFIG}"
  artifacts:
    paths:
      - site/
  environment:
    name: review/${CI_JOB_NAME_SLUG}/${CI_MERGE_REQUEST_PROJECT_PATH}/${CI_MERGE_REQUEST_IID}
    url: https://${CI_PROJECT_NAMESPACE}.${CI_PAGES_DOMAIN}/-/${CI_PROJECT_NAME}/-/jobs/${CI_JOB_ID}/artifacts/site/index.html

.build-zensical:
  extends: .build-mkdocs
  variables:
    DOCS_ENGINE: zensical

review-docs:
  extends: .build-mkdocs

review-docs-zensical:
  extends: .build-zensical

review-e2e:
  extends: .build-mkdocs
  before_script:
    - cd playwright/resources
  after_script:
    - mv playwright/resources/site/ site/
  parallel:
    matrix:
      - MKDOCS_CONFIG: mkdocs.yml
      - MKDOCS_CONFIG: mkdocs-minimal.yml

review-e2e-pw:
  extends: .build-mkdocs
  before_script:
    - cd playwright/resources
  after_script:
    - mv playwright/resources/site/ site/
  parallel:
    matrix:
      - MKDOCS_CONFIG: mkdocs.yml
      - MKDOCS_CONFIG: mkdocs-minimal.yml

review-e2e-zensical:
  extends: .build-zensical
  before_script:
    - cd playwright/resources
  after_script:
    - mv playwright/resources/site/ site/
  parallel:
    matrix:
      - MKDOCS_CONFIG: mkdocs.yml
      - MKDOCS_CONFIG: mkdocs-minimal.yml

review-e2e-windows:
  extends: .build-mkdocs
  image: python:3.14@sha256:7aea6827c8787754f99339ffed8cfc41fb09421f9c7d0e77a198b08422a3455e
  before_script:
    - cd playwright/resources
    - $proxySettings = New-Object System.Net.WebProxy("$CODE_PROXY", $true)
    - $proxySettings.BypassList = $CODE_NO_PROXY -split ",";
    - "[System.Net.WebRequest]::DefaultWebProxy = $proxySettings"
    - curl https://astral.sh/uv/install.ps1 -o install.ps1
    - .\install.ps1
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
  after_script:
    - mv ./playwright/resources/site/ ./site/
  tags:
    - WINDOWS-DOCKER-LTSC2025

.test-e2e:
  extends: .rules-merge-requests
  stage: test
  needs:
    - build-dist
    - build-e2e
  variables:
    CYPRESS_HOST: docs-theme-service
    no_proxy: $CODE_NO_PROXY,docs-theme-service
    HTTP_PROXY: $CODE_PROXY
    HTTPS_PROXY: $CODE_PROXY
    NO_PROXY: $CODE_NO_PROXY,docs-theme-service
    GIT_LFS_SKIP_SMUDGE: "0"
  image:
    name: cypress/included:15.18.1@sha256:4bb163e4dda39e1f4cd450bd4acf9f78e4445d799dfdcbe82c9d15fcb512c58e
    entrypoint: [""]
  services:
    - name: $CI_REGISTRY_IMAGE/$DOCKERFILENAME:dev-$CI_COMMIT_SHORT_SHA
      alias: docs-theme-service
  script:
    - echo "precedence ::ffff:0:0/96  100" >> /etc/gai.conf
    - yarn --frozen-lockfile --ignore-engines
    - yarn e2e:run
    - yarn e2e:run:minimal
  artifacts:
    when: always
    expire_in: 1d
    paths:
      - dist/
      - cypress/screenshots
      - cypress/snapshots
    reports:
      junit: cypress/results/report-*.xml
  dependencies:
    - build-dist

test-e2e-chrome:
  extends: .test-e2e
  variables:
    CYPRESS_BROWSER: chrome

test-e2e-firefox:
  extends: .test-e2e
  variables:
    CYPRESS_BROWSER: firefox

test-e2e-snapshots:
  extends: .test-e2e
  variables:
    CYPRESS_updateSnapshots: "true"
  script:
    - echo "precedence ::ffff:0:0/96  100" >> /etc/gai.conf
    - yarn --frozen-lockfile
    - yarn e2e:run:chrome
    - yarn e2e:run:firefox
    - yarn e2e:run:minimal:chrome
    - yarn e2e:run:minimal:firefox
  rules:
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true # non-blocking job

.test-e2e-pw:
  extends: .rules-merge-requests
  stage: test
  needs:
  - build-dist
  - build-e2e
  variables:
    PLAYWRIGHT_HOST: docs-theme-service
    PLAYWRIGHT_PROJECT: ""
    PLAYWRIGHT_TEST_ARGS: ""
    no_proxy: $CODE_NO_PROXY,docs-theme-service
    HTTP_PROXY: $CODE_PROXY
    HTTPS_PROXY: $CODE_PROXY
    NO_PROXY: $CODE_NO_PROXY,docs-theme-service
    GIT_LFS_SKIP_SMUDGE: "0"
  image:
    name: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    entrypoint: [""]
  services:
    - name: $CI_REGISTRY_IMAGE/$DOCKERFILENAME:dev-$CI_COMMIT_SHORT_SHA
      alias: docs-theme-service
  script:
    - yarn --frozen-lockfile
    - yarn playwright test ${PLAYWRIGHT_PROJECT:+--project=$PLAYWRIGHT_PROJECT} $PLAYWRIGHT_TEST_ARGS
    - PLAYWRIGHT_SUITE=minimal yarn playwright test ${PLAYWRIGHT_PROJECT:+--project=$PLAYWRIGHT_PROJECT} $PLAYWRIGHT_TEST_ARGS
  artifacts:
    when: always
    expire_in: 1d
    paths:
      - dist/reports/playwright
    reports:
      junit: dist/reports/playwright/junit.xml
  dependencies:
    - build-dist

test-e2e-pw:
  extends: .test-e2e-pw
  parallel:
    matrix:
      - PLAYWRIGHT_PROJECT: chromium
      - PLAYWRIGHT_PROJECT: firefox

test-e2e-pw-snapshots:
  extends: .test-e2e-pw
  variables:
    PLAYWRIGHT_TEST_ARGS: "--update-snapshots"
  artifacts:
    when: always
    expire_in: 1d
    paths:
      - playwright/e2e/
  rules:
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true # non-blocking job

test-e2e-zensical:
  extends: .test-e2e-pw
  variables:
    DOCS_ENGINE: zensical
  parallel:
    matrix:
      - PLAYWRIGHT_PROJECT: chromium
      - PLAYWRIGHT_PROJECT: firefox

test-e2e-zensical-snapshots:
  extends: .test-e2e-pw
  variables:
    DOCS_ENGINE: zensical
    PLAYWRIGHT_TEST_ARGS: "--update-snapshots"
  artifacts:
    when: always
    expire_in: 1d
    paths:
      - playwright/e2e/
  rules:
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true # non-blocking job

deploy:
  stage: deploy
  variables:
    UV_PUBLISH_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi/
    UV_PUBLISH_USERNAME: gitlab-ci-token
    UV_PUBLISH_PASSWORD: ${CI_JOB_TOKEN}
  script:
    - uv publish
  dependencies:
    - build-dist
  only:
    - tags

pages:
  extends: .build-mkdocs
  stage: deploy
  after_script:
    - mv site/ public/
  artifacts:
    paths:
      - public/
  environment: # do not create an environment on main
  rules:
    - if: '$CI_PROJECT_NAMESPACE == "code-ops" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
